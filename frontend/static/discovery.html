<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DINAS - Discovery</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="sidebar">
  <h2>DINAS</h2>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/infrastructure.html">Infrastructure</a>
    <a href="/topology.html">Topology</a>
    <a href="/telemetry.html">Telemetry</a>
    <a href="/anomalies.html">Anomalies</a>
    <a href="/agents.html">Agents</a>
    <a href="/discovery.html" class="active">Discovery</a>
  </nav>
</div>

<div class="main">
  <h1>Discovery</h1>
  <p class="subtitle">Network scanning and device discovery</p>

  <div class="box">
    <div class="box-title">New Scan</div>
    <div style="padding:12px 16px;display:flex;gap:12px;align-items:flex-end">
      <div style="flex:1"><label>Target</label><input type="text" id="target" placeholder="IP range (e.g. 192.168.1.0/24)" style="width:100%"></div>
      <div><label>Scan Type</label><select id="type"><option value="quick">Quick (ICMP)</option><option value="full">Full (Nmap)</option><option value="arp">ARP (Local)</option></select></div>
      <button class="btn btn-primary" id="scan-btn" onclick="startScan()">Start Scan</button>
    </div>
    <div id="scan-msg" style="padding:0 16px 12px;font-size:12px;color:#f59e0b;display:none"></div>
  </div>

  <div class="box">
    <div class="box-title">Scan History <button class="btn btn-ghost btn-sm" onclick="loadJobs()">Refresh</button></div>
    <div id="table"></div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
function loadJobs() {
  loading('table', 'Loading scans...');
  get('/discovery/jobs', function(d) {
    var jobs = d.jobs || [];
    if (!jobs.length) { empty('table', 'No scans yet. Enter a target above and start one.'); return; }

    var h = '<table><tr><th>Target</th><th>Type</th><th>Status</th><th>Devices</th><th>Started</th><th>Completed</th></tr>';
    jobs.forEach(function(j) {
      h += '<tr><td><code>' + safe(j.target) + '</code></td>' +
        '<td>' + safe(j.scan_type || '—') + '</td>' +
        '<td>' + badge(j.status) + '</td>' +
        '<td>' + (j.devices_found != null ? j.devices_found : '—') + '</td>' +
        '<td>' + time(j.started_at) + '</td>' +
        '<td>' + time(j.completed_at) + '</td></tr>';
    });
    $('table').innerHTML = h + '</table>';
  }, function(e) { error('table', e.message); });
}

function startScan() {
  var t = $('target').value.trim();
  if (!t) return;

  $('scan-btn').disabled = true;
  $('scan-btn').textContent = 'Scanning...';

  post('/discovery/jobs', { target: t, scan_type: $('type').value }, function() {
    $('target').value = '';
    $('scan-btn').disabled = false;
    $('scan-btn').textContent = 'Start Scan';
    setTimeout(loadJobs, 500);
  }, function(e) {
    $('scan-msg').style.display = 'block';
    $('scan-msg').textContent = e.message;
    $('scan-btn').disabled = false;
    $('scan-btn').textContent = 'Start Scan';
  });
}

$('target').onkeydown = function(e) { if (e.key === 'Enter') startScan(); };

if ($('type').value === 'full') {
  $('scan-msg').style.display = 'block';
  $('scan-msg').textContent = 'Full scan requires Nmap installed on the system.';
}

loadJobs();
</script>
</body>
</html>
