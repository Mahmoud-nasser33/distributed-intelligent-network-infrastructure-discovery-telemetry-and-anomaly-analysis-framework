<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DINAS - Agents</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="sidebar">
  <h2>DINAS</h2>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/infrastructure.html">Infrastructure</a>
    <a href="/topology.html">Topology</a>
    <a href="/telemetry.html">Telemetry</a>
    <a href="/anomalies.html">Anomalies</a>
    <a href="/agents.html" class="active">Agents</a>
    <a href="/discovery.html">Discovery</a>
  </nav>
</div>

<div class="main">
  <h1>Agents</h1>
  <p class="subtitle" id="subtitle">Loading...</p>

  <div class="box">
    <div class="box-title">Registered Agents</div>
    <div id="table"></div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
loading('table', 'Loading agents...');

get('/agents', function(d) {
  var agents = d.agents || [];
  var active = agents.filter(function(a) { return a.status === 'active'; }).length;
  $('subtitle').textContent = agents.length + ' agents, ' + active + ' active';

  if (!agents.length) { empty('table', 'No agents registered. Start a DINAS agent to begin collecting data.'); return; }

  var h = '<table><tr><th>Name</th><th>Status</th><th>Type</th><th>IP</th><th>Version</th><th>Last Heartbeat</th></tr>';
  agents.forEach(function(a) {
    var stale = a.last_heartbeat && (Date.now() - new Date(a.last_heartbeat).getTime()) > 300000;
    h += '<tr>' +
      '<td>' + safe(a.name || a.hostname || '—') + '</td>' +
      '<td>' + badge(a.status) + '</td>' +
      '<td>' + safe(a.agent_type || '—') + '</td>' +
      '<td><code>' + safe(a.ip_address || '—') + '</code></td>' +
      '<td>' + safe(a.version || '—') + '</td>' +
      '<td style="color:' + (stale ? '#f59e0b' : '#9ca3af') + '">' + time(a.last_heartbeat) + '</td></tr>';
  });
  $('table').innerHTML = h + '</table>';
}, function(e) { error('table', e.message); });
</script>
</body>
</html>
